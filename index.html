<!DOCTYPE html><html><head><meta charset=UTF-8><title>Moonlight Chess</title></head>
<body style="margin:0;background:#0a0a1a;color:#ffd700;font-family:system-ui;min-height:100vh;display:flex;align-items:center;justify-content:center"><div id=s>Loading…</div>
<script>
(async()=>{
  const n=15;
  let b64='';
  for(let i=0;i<n;i++){b64+=await(await fetch('b64p'+i+'.txt')).text();}
  const bin=atob(b64);const u=new Uint8Array(bin.length);
  for(let i=0;i<bin.length;i++)u[i]=bin.charCodeAt(i);
  const html=new TextDecoder().decode(u);
  document.open();document.write(html);document.close();
})().catch(e=>{document.getElementById('s').textContent=String(e)});
</script></body></html>
